spring.application.name=Vestibuline

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAMEP}?sslmode=require
spring.datasource.username=${DB_USERNAMEP}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=lucasrofran15@gmail.com

spring.mail.password=${APP_PASSWORD_GOOGLE}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=5000
spring.mail.properties.mail.writetimeout=5000

server.error.include-stacktrace=always

spring.flyway.clean-disabled=false

server.port=8081

server.address=0.0.0.0

#GOOGLE
infra.google.client-id=${AUTH_CLIENT}

#MICROSOFT
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.tenant-id=${MICROSOFT_TENANT_ID}

#META
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}

api.security.token.secret=${JWT_SECRET_VESTIBULINE}

app.jwt.expiration-ms=60000

upload.dir=./uploads/